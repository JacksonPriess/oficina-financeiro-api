name: CI/CD Pipeline - Financeiro

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: financeiro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # CI
  # ============================================================
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oficina_financeiro_test
          POSTGRES_USER: financeiro_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financeiro_test -d oficina_financeiro_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FINANCEIRO_INTEGRATION_TESTS: 'true'
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/oficina_financeiro_test
      SPRING_DATASOURCE_USERNAME: financeiro_test
      SPRING_DATASOURCE_PASSWORD: test-only
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Executar testes do provedor mock
        run: python3 -m unittest discover -s tests/mock -v

      - name: Validar configuração de deploy
        run: |
          python3 -m py_compile scripts/deploy-k8s.py
          kubectl kustomize k8s > /dev/null

      - name: Executar testes e empacotar aplicação
        run: sh mvnw -B verify

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-oficina-financeiro-api
          path: target/site/jacoco/
          if-no-files-found: warn

  # ============================================================
  # CD
  # ============================================================
  deploy:
    name: Publicar imagens e implantar no EKS
    needs: testes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: oficina-api-dev-cluster
      K8S_NAMESPACE: default
      FINANCEIRO_ECR_REPOSITORY: oficina-financeiro-dev-repo
      MOCK_ECR_REPOSITORY: oficina-provedor-mock-dev-repo
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar acesso ao EKS e verificar pré-requisitos
        env:
          FINANCEIRO_API_KEY: ${{ secrets.FINANCEIRO_API_KEY }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          PROVEDOR_CLIENT_SECRET: ${{ secrets.PROVEDOR_CLIENT_SECRET }}
          MOCK_ADMIN_KEY: ${{ secrets.MOCK_ADMIN_KEY }}
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          aws ecr describe-repositories --region "$AWS_REGION" \
            --repository-names "$FINANCEIRO_ECR_REPOSITORY" "$MOCK_ECR_REPOSITORY" \
            --query 'repositories[].repositoryName' --output text
          python3 scripts/deploy-k8s.py preflight

      - name: Autenticar no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publicar imagens no Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          FINANCEIRO_IMAGE="$ECR_REGISTRY/$FINANCEIRO_ECR_REPOSITORY:$IMAGE_TAG"
          MOCK_IMAGE="$ECR_REGISTRY/$MOCK_ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$FINANCEIRO_IMAGE" .
          docker build -t "$MOCK_IMAGE" mock
          docker push "$FINANCEIRO_IMAGE"
          docker push "$MOCK_IMAGE"

      - name: Implantar no Amazon EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          FINANCEIRO_API_KEY: ${{ secrets.FINANCEIRO_API_KEY }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          PROVEDOR_CLIENT_SECRET: ${{ secrets.PROVEDOR_CLIENT_SECRET }}
          MOCK_ADMIN_KEY: ${{ secrets.MOCK_ADMIN_KEY }}
        run: python3 scripts/deploy-k8s.py deploy
