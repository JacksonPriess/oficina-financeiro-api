spring:
  profiles:
    active: local,rabbit

  application:
    name: financeiro-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15435/oficina_financeiro_db}
    username: ${SPRING_DATASOURCE_USERNAME:financeiro_app}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
  task:
    scheduling:
      pool:
        size: 2

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

financeiro:
  security:
    api-key: ${FINANCEIRO_API_KEY}
  provedor:
    url: ${PROVEDOR_URL:http://localhost:8090}
    client-id: ${PROVEDOR_CLIENT_ID:oficina-financeiro}
    client-secret: ${PROVEDOR_CLIENT_SECRET}
  workers:
    enabled: ${FINANCEIRO_WORKERS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
